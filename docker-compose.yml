name: pulseops

# Default `docker compose up -d` starts infrastructure only (Kafka + PostgreSQL).
# The Java apps run from your IDE/Maven against localhost.
#
# To also run the applications in containers:
#   docker compose --profile apps up -d --build

services:
  postgres:
    image: postgres:16-alpine
    container_name: pulseops-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pulseops}
      POSTGRES_USER: ${POSTGRES_USER:-pulseops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulseops}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pulseops} -d ${POSTGRES_DB:-pulseops}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.8.0
    container_name: pulseops-kafka
    ports:
      # Host clients connect to localhost:9092 and are advertised localhost:9092.
      # Containers connect to kafka:9092. Two listeners, one broker.
      - "9092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: pulseops-local-cluster
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,HOST://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:3.8.0
    container_name: pulseops-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - ./infrastructure/kafka:/scripts:ro
    entrypoint: ["/bin/sh", "/scripts/init-topics.sh"]
    restart: "no"

  # ---------------------------------------------------------------------------
  # Application containers. Started only with `--profile apps`, because the
  # normal loop is to run the Java apps from the IDE against this infrastructure.
  #
  # Inside the network these use service names, never localhost: a container's
  # localhost is itself.
  # ---------------------------------------------------------------------------

  api:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: backend/pulseops-api/Dockerfile
    container_name: pulseops-api
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-pulseops}
      POSTGRES_USER: ${POSTGRES_USER:-pulseops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulseops}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  worker:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: backend/pulseops-worker/Dockerfile
    container_name: pulseops-worker
    depends_on:
      # The API owns Flyway, so the schema must exist before the worker validates against it.
      api:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-pulseops}
      POSTGRES_USER: ${POSTGRES_USER:-pulseops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulseops}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Empty selects the offline rule-based provider; set it in .env to use a real model.
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4.1-mini}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_AUTH_HEADER: ${LLM_AUTH_HEADER:-bearer}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-120}
    ports:
      - "8084:8084"
    restart: unless-stopped

  payment:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: backend/shopflow-payment-service/Dockerfile
    container_name: shopflow-payment
    depends_on:
      api:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-pulseops}
      POSTGRES_USER: ${POSTGRES_USER:-pulseops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulseops}
      PULSEOPS_INGEST_BASE_URL: http://api:8081
    ports:
      - "8083:8083"
    restart: unless-stopped

  order:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: backend/shopflow-order-service/Dockerfile
    container_name: shopflow-order
    depends_on:
      api:
        condition: service_healthy
      payment:
        condition: service_started
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-pulseops}
      POSTGRES_USER: ${POSTGRES_USER:-pulseops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulseops}
      PULSEOPS_INGEST_BASE_URL: http://api:8081
      SHOPFLOW_PAYMENT_BASE_URL: http://payment:8083
    ports:
      - "8082:8082"
    restart: unless-stopped

  web:
    profiles: ["apps"]
    build:
      context: frontend/pulseops-web
      dockerfile: Dockerfile
    container_name: pulseops-web
    depends_on:
      api:
        condition: service_healthy
    environment:
      # nginx proxies /api here, so the browser still sees a single origin and needs no CORS.
      API_UPSTREAM: http://api:8081
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  postgres-data:
  kafka-data:
